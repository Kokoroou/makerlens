name: Feedback on the home page or the site
description: The landing page, a broken link, search results, the address — no GitHub experience needed.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! For a problem inside one of the tools, the links on the previous page go to its own issue list.

        **Please do not attach game files, images or audio.**
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - Something is broken (bug, broken link)
        - I have an idea
        - I have a question
        - Something else
      default: 0
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Tell us in your own words
      description: Short is fine. Which page, and what happened?
      placeholder: "e.g. The FAQ link on the home page shows Page Not Found."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser (optional)
      description: For example Chrome, Edge, Firefox, Safari.
      placeholder: Chrome on Windows
