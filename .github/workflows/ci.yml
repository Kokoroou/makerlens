# Project CI, from agent-toolkit's templates/.github/workflows/ci.yml: builds the
# site from the tools' main branches and checks it, plus Gitleaks + Semgrep.
# Keep the name "CI": the toolkit's merge gate looks for it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: kokoroou/agent-toolkit/.github/workflows/quality.yml@v0
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      setup-command: >-
        git clone --depth 1 https://github.com/Kokoroou/rpgmaker-assets-viewer tools/assets &&
        git clone --depth 1 https://github.com/Kokoroou/rpgmaker-events-viewer tools/events &&
        npm ci && npm run build
      # Tools in place, CSP/hosts, local links, JSON-LD (scripts/check-site.mjs).
      lint-command: npm run check
      format-check-command: ""
      # src/worker.js against a fake ASSETS binding (tests/worker.test.mjs).
      test-command: npm test
      coverage-command: ""
      baseline-branch: main
      enable-pr-title-check: false
    secrets:
      gitleaks_license: ${{ secrets.GITLEAKS_LICENSE }} # only for organization repos
